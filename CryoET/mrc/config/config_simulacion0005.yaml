metadata:
  description: BicapaCryoET simulacion5 -> PolNet pipeline
  author: BicapaCryoET v15

folders:
  root: ./
  input: ./polnet_entrada/
  output: ./polnet_salida/simulacion0005/

global:
  ntomos: 1
  seed: 5

sample:
  voi_shape: [400, 400, 200]
  voxel_size: 10
  membranes:
    - mb_type: file
      mb_file: /home/alumno25/TFM/CryoET/mrc/densidad/bicapa_simulacion0005.mrc
      mb_thick: 5.0714

tem:
  snr: 0.1
  tilt_range: [-60, 60, 3]

# Instrucciones:
#   1. Instala PolNet: pip install polnet
#   2. Ejecuta: polnet --config config_simulacion0005.yaml
#   3. El tomograma simulado estara en polnet_salida/simulacion0005/
#
# Referencia:
#   Martinez-Sanchez et al. IEEE Trans. Med. Imaging 2024
#   https://doi.org/10.1109/TMI.2024.3398401
